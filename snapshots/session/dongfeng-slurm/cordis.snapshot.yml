# Keyless replay replaces the model and subprocess providers while loading the
# real Dongfeng source overlay and deterministic Slurm fixture.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- insert:
    - id: subprocess-fixture
      name: './fake-slurm.ts'
    - id: dongfeng-slurm
      name: '../../../plugins/dongfeng-slurm/src/index.ts'
      config:
        workRoot: !!js (process.env.USER ??= 'snapshot-user', process.env.UID ??= '1000', process.cwd())
        defaultPartition: Students
        defaultQos: qos_stu_default
        commandTimeoutMs: 15000
        logMaxBytes: 65536
        listMaxItems: 100
        cancelRequiresApproval: true
        rawOutputMaxBytes: 1048576
        graceMs: 3000
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
